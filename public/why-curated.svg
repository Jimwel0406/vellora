<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="A curated flat-lay of marketplace products: a plant, a planner, headphones, a mug and a phone on a warm sand surface.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EDD8"/>
      <stop offset="1" stop-color="#EADFC4"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3D2B1F" flood-opacity="0.16"/>
    </filter>
    <filter id="soft-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#3D2B1F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- warm sand surface -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g stroke="#3D2B1F" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
  </g>

  <!-- === plant in a terracotta pot (top-left) === -->
  <g filter="url(#soft)">
    <ellipse cx="285" cy="320" rx="118" ry="22" fill="#3D2B1F" opacity="0.12"/>
    <path d="M285 150 C240 150 196 175 178 220 C160 265 176 285 220 296 L350 296 C394 285 410 265 392 220 C374 175 330 150 285 150 Z" fill="#5A7A4A"/>
    <path d="M285 170 C262 210 246 250 244 292" stroke="#47653A" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M285 170 C308 210 324 250 326 292" stroke="#47653A" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M285 180 C285 230 285 260 285 292" stroke="#47653A" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M215 296 L355 296 L338 372 L232 372 Z" fill="#A6634B"/>
    <rect x="222" y="366" width="126" height="20" rx="8" fill="#8B4513"/>
  </g>

  <!-- === planner / notebook (bottom-left) === -->
  <g filter="url(#soft)">
    <g transform="rotate(-6 320 640)">
      <rect x="190" y="560" width="260" height="170" rx="14" fill="#5C4636"/>
      <rect x="204" y="572" width="232" height="146" rx="8" fill="#F4EAD3"/>
      <g stroke="#D8C9AC" stroke-width="3">
        <line x1="290" y1="580" x2="290" y2="712"/>
        <line x1="340" y1="580" x2="340" y2="712"/>
        <line x1="390" y1="580" x2="390" y2="712"/>
      </g>
      <rect x="216" y="588" width="52" height="118" rx="4" fill="#EFE3C6"/>
      <rect x="372" y="676" width="52" height="28" rx="6" fill="#C89B5F"/>
    </g>
  </g>

  <!-- === headphones (top-right) === -->
  <g filter="url(#soft)">
    <g transform="rotate(8 900 270)">
      <ellipse cx="900" cy="332" rx="120" ry="18" fill="#3D2B1F" opacity="0.12"/>
      <path d="M830 300 C830 205 970 205 970 300" stroke="#8A7565" stroke-width="16" fill="none" stroke-linecap="round"/>
      <rect x="792" y="286" width="60" height="104" rx="26" fill="#EADFC4"/>
      <rect x="804" y="296" width="36" height="84" rx="18" fill="#C89B5F"/>
      <rect x="948" y="286" width="60" height="104" rx="26" fill="#EADFC4"/>
      <rect x="960" y="296" width="36" height="84" rx="18" fill="#C89B5F"/>
    </g>
  </g>

  <!-- === mug (bottom-right) === -->
  <g filter="url(#soft)">
    <g transform="rotate(-8 930 620)">
      <ellipse cx="930" cy="704" rx="108" ry="16" fill="#3D2B1F" opacity="0.12"/>
      <rect x="862" y="540" width="136" height="164" rx="16" fill="#F6EFDF"/>
      <rect x="884" y="556" width="92" height="132" rx="8" fill="#6B4A34"/>
      <path d="M998 576 a54 54 0 0 1 0 92" stroke="#F6EFDF" stroke-width="18" fill="none"/>
      <rect x="872" y="692" width="116" height="18" rx="9" fill="#C89B5F"/>
    </g>
  </g>

  <!-- === phone (center-right) === -->
  <g filter="url(#soft)">
    <g transform="rotate(14 700 470)">
      <rect x="640" y="390" width="120" height="208" rx="20" fill="#3D2B1F"/>
      <rect x="648" y="398" width="104" height="192" rx="14" fill="#F4EAD3"/>
      <rect x="648" y="398" width="104" height="44" rx="14" fill="#A6634B"/>
      <circle cx="700" cy="402" r="3" fill="#F4EAD3"/>
    </g>
  </g>
</svg>
